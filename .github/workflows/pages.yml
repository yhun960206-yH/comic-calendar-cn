name: Publish verified calendar

on:
  schedule:
    - cron: '17 3,15 * * *' # UTC, off the hour; GitHub schedules may run late or be skipped
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate verified input and run tests
        run: |
          python3 -m src.validate --input data/events.json
          python3 -m src.history
          python3 -m unittest discover -s tests -v
      - name: Build production site (no demo)
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          test -n "$BASE_URL" || { echo 'Set repository variable BASE_URL to the real HTTPS Pages URL ending in /'; exit 1; }
          INPUT="$RUNNER_TEMP/events.json"
          if [ -n "$FEC_API_KEY" ]; then
            # FEC authorized API. Any source or checkpoint failure stops the job
            # BEFORE artifact upload, so the live site is never replaced.
            python3 -m src.sources.pipeline --base-url "$BASE_URL" --input data/events.json \
              --output "$INPUT" --bili
          else
            # FEC explicitly licenses its public data CC BY-SA 4.0. Crawl its
            # public structured pages conservatively; fail closed.
            python3 -m src.sources.pipeline --base-url "$BASE_URL" --input data/events.json \
              --output "$INPUT" --public-web --bili
          fi
          python3 -m src.build --base-url "$BASE_URL" --input "$INPUT" --output public
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert not json.loads(Path('public/events.json').read_text())['demo']
          assert not json.loads(Path('public/status.json').read_text())['demo']
          assert Path('public/index.html').exists()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: check-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
